[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timesfm-serve"
version = "0.1.0"
description = "Production-ready REST API and Docker serving container for Google TimesFM foundation model"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "enlotec" }
]

[project.urls]
Homepage = "https://github.com/enlotec/timesfm-serve"
Repository = "https://github.com/enlotec/timesfm-serve"
Issues = "https://github.com/enlotec/timesfm-serve/issues"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "numpy>=1.26.0",
    "torch>=2.4.0",
    "timesfm>=2.0.0",
    "structlog>=24.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
timesfm-serve = "timesfm_serve.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["timesfm_serve"]

[tool.ruff]
line-length = 100
target-version = "py311"
